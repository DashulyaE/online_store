  <body>

	  <div class="col-2 text-bg-dark p-3 sidebar">

			  <div class="card-body text-success">

							<i class="bi bi-building"> </i>Главная
						  </a>
						  <a href="category.html" class="list-group-item text-bg-dark border-0 list-group-item-action"><i class="bi bi-card-checklist"> </i>Категории</a>
						  <a href="catalog.html" class="list-group-item text-bg-dark border-0 list-group-item-action"><i class="bi bi-basket"> </i>Заказы</a>

			  <div class="card-footer border-light bg-transparent border-success mt-3">

						<button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
						Пользователь
						</button>
						<ul class="dropdown-menu text-bg-secondary p-3">

	  <div class="col-10">
		 <div class="row">
			 <div class="col-12"><h1 class="text-center mt-0 mb-5">Контакты</h1></div>
		 </div>
		<div class="row">
		  <div class="col-2"></div>
				  <div class="col-4 border border-dark-subtle rounded-1" style="width: 30rem;">
					  <form method="POST" action="/">
						<div class="mb-3 px-1 pt-3">
							<label class="form-label">Имя</label>
							<input type="text" class="form-control">
						</div>
						<label class="form-label">Email</label>
						<div class="input-group mb-3">
						  <span class="input-group-text" id="basic-addon1">@</span>
						  <input type="email" class="form-control" aria-label="Username" aria-describedby="basic-addon1">
						</div>
						<div class="mb-3">
							<textarea name="message" class="form-control" placeholder="Сообщение" rows="3"></textarea>
						</div>

						<button type="submit" class="btn btn-primary mb-3">Отправить</button>
					  </form>
				  </div>

		  <div class="col-4">
				<div class="card border-0 mx-auto" style="width: 30rem;">
				  <div class="card-body">
					<h5 class="card-title">Наши контакты</h5>
					<p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
				  </div>
				</div>
		  </div>
		  <div class="col-2"></div>
